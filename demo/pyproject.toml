[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bloated-demo-app"
version = "0.1.0"
description = "A deliberately dependency-heavy demo application for testing ZeroDep Doctor"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "tabulate>=0.9.0",
    "networkx>=3.0",
    "pytz>=2023.3",
    "colorama>=0.4.6",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
